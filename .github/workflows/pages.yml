name: 部署网页

# 修改网页代码后自动重新部署（每日抓取的工作流会自己部署，不走这里）
on:
  push:
    branches: [main]
    paths: ["docs/**", "scripts/fetch_music.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-wisdom
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: 读取 B 站收藏夹（生成背景音乐清单）
        run: python3 scripts/fetch_music.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
