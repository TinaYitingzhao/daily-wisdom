name: 每日抓取微博

on:
  schedule:
    # GitHub 的 cron 用 UTC 时间。23:00 UTC = 北京时间早上 7:00
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      initial:
        description: "首次运行抓取条数（仓库里已有内容时忽略）"
        default: "100"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-wisdom
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取微博
        id: fetch
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
        run: python3 scripts/fetch_weibo.py --initial "${{ github.event.inputs.initial || '100' }}"

      # 即使抓取中途出错，也把已经成功下载的内容提交，避免白跑
      - name: 提交新内容
        if: always() && steps.fetch.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/images
          if git diff --cached --quiet; then
            echo "没有新内容。"
          else
            git commit -m "每日更新：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi

  deploy:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
