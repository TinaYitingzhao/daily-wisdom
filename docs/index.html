<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>每日智慧</title>
  <meta name="description" content="索达吉堪布微博每日相册，自动滚动与幻灯片播放。">
  <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="每日智慧">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="masthead" class="masthead" hidden>
    <img id="mastAvatar" class="avatar" alt="" width="72" height="72">
    <h1 id="mastName" class="mast-name"></h1>
  </header>

  <main id="feed" class="feed" aria-live="off"></main>

  <section id="slides" class="slides" hidden>
    <div id="stage" class="stage"></div>
    <div class="slide-progress"><div id="progress"></div></div>
  </section>

  <p id="status" class="status">正在加载…</p>
  <p id="toast" class="toast" role="status" aria-live="polite" hidden></p>

  <!-- YouTube 曲目的播放器（播放 YouTube 时显示在右上角，按 YouTube 的要求不能隐藏） -->
  <div id="yt" class="yt off" aria-hidden="true"><div id="ytPlayer"></div></div>

  <nav id="controls" class="controls" aria-label="播放控制">
    <div class="seg" role="group" aria-label="模式">
      <button data-mode="scroll" type="button">滚动</button>
      <button data-mode="slides" type="button">幻灯片</button>
    </div>

    <button id="prev" class="icon slides-only" type="button" aria-label="上一条"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button id="play" class="icon play" type="button" aria-label="暂停"></button>
    <button id="next" class="icon slides-only" type="button" aria-label="下一条"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>

    <label class="speed">
      <span id="speedLabel">速度</span>
      <input id="speed" type="range" min="1" max="10" step="1">
      <output id="speedValue"></output>
    </label>

    <span class="music">
      <button id="music" class="icon" type="button" aria-label="背景音乐：关" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></button>
      <span id="musicExtra" class="music-extra" hidden>
        <button id="musicNext" class="icon" type="button" aria-label="下一首"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5l9 7-9 7zM18 5v14"/></svg></button>
        <input id="volume" type="range" min="0" max="100" step="5" aria-label="音量">
      </span>
    </span>

    <button id="theme" class="icon" type="button" aria-label="切换深浅色"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
    <button id="fullscreen" class="icon" type="button" aria-label="全屏"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
