<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>每日智慧</title>
  <meta name="description" content="索达吉堪布微博每日相册，自动滚动与幻灯片播放。">
  <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="每日智慧">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="masthead" class="masthead" hidden>
    <img id="mastAvatar" class="avatar" alt="" width="72" height="72">
    <h1 id="mastName" class="mast-name"></h1>
  </header>

  <main id="feed" class="feed" aria-live="off"></main>

  <section id="slides" class="slides" hidden>
    <div id="stage" class="stage"></div>
    <div class="slide-progress"><div id="progress"></div></div>
  </section>

  <p id="status" class="status">正在加载…</p>
  <p id="toast" class="toast" role="status" aria-live="polite" hidden></p>

  <!-- YouTube 曲目的播放器（播放 YouTube 时显示在右上角，按 YouTube 的要求不能隐藏） -->
  <div id="yt" class="yt off" aria-hidden="true"><div id="ytPlayer"></div></div>

  <!-- 相框时钟（参考 iPhone 待机显示） -->
  <div id="clock" class="clock" hidden><span id="clockTime" class="clock-time"></span><span id="clockDate" class="clock-date"></span></div>

  <!-- 夜间自动变暗 -->
  <div id="night" class="night" aria-hidden="true"></div>

  <!-- 控制栏：平时隐藏，轻点屏幕出现（参考 Apple TV 播放控制） -->
  <nav id="controls" class="controls" aria-label="播放控制">
    <button id="prev" class="ctl slides-only" type="button" aria-label="上一条"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button id="play" class="ctl ctl-main" type="button" aria-label="暂停"></button>
    <button id="next" class="ctl slides-only" type="button" aria-label="下一条"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    <span class="ctl-sep" aria-hidden="true"></span>
    <button id="music" class="ctl ctl-small" type="button" aria-label="背景音乐：关" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></button>
    <button id="settingsBtn" class="ctl ctl-small" type="button" aria-label="设置" aria-expanded="false" aria-controls="sheet"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg></button>
  </nav>

  <!-- 设置面板（参考 iOS 控制中心 / 设置的分组样式） -->
  <section id="sheet" class="sheet" role="dialog" aria-label="设置" hidden>
    <div class="group">
      <div class="row">
        <span class="label">播放方式</span>
        <div class="seg" role="group" aria-label="播放方式">
          <button data-mode="slides" type="button">幻灯片</button>
          <button data-mode="scroll" type="button">滚动</button>
        </div>
      </div>
      <label class="row">
        <span class="label" id="speedLabel">速度</span>
        <input id="speed" type="range" min="1" max="10" step="1" aria-labelledby="speedLabel">
        <output id="speedValue" class="value"></output>
      </label>
    </div>

    <div class="group">
      <label class="row">
        <span class="label">背景音乐</span>
        <input id="musicToggle" class="switch" type="checkbox" role="switch">
      </label>
      <div id="musicExtra" class="row" hidden>
        <button id="musicNext" class="pill-btn" type="button">下一首</button>
        <input id="volume" type="range" min="0" max="100" step="5" aria-label="音量">
        <span id="nowPlaying" class="value now"></span>
      </div>
    </div>

    <div class="group">
      <div class="row">
        <span class="label">外观</span>
        <div class="seg" role="group" aria-label="外观">
          <button data-theme-opt="auto" type="button">自动</button>
          <button data-theme-opt="light" type="button">浅色</button>
          <button data-theme-opt="dark" type="button">深色</button>
        </div>
      </div>
      <label class="row">
        <span class="label">显示时钟</span>
        <input id="clockToggle" class="switch" type="checkbox" role="switch">
      </label>
      <label class="row">
        <span class="label">夜间自动变暗<small>22:00 – 6:00</small></span>
        <input id="nightToggle" class="switch" type="checkbox" role="switch">
      </label>
    </div>

    <button id="fullscreen" class="sheet-btn" type="button">进入全屏</button>
  </section>

  <script src="app.js"></script>
</body>
</html>
